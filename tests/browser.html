<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket checks</title><style>body{background:#101311;color:#eee;font:16px system-ui;padding:24px}button{padding:16px;background:#ccff7c;border:0;border-radius:8px}li{margin:12px 0}.fail{color:#ff9999}.pass{color:#ccff7c}</style><h1>Pocket integration checks</h1><p>Generated test tones only. Test data lives on this separate local origin.</p><button id="run">Run checks</button><ol id="results"></ol><script type="module">
import * as db from '../dist/store.js';import {inspectFile} from '../dist/metadata.js';import {Player} from '../dist/player.js';
const out=document.querySelector('#results');function check(name,value){const li=document.createElement('li');li.textContent=`${value?'PASS':'FAIL'} — ${name}`;li.className=value?'pass':'fail';out.append(li);if(!value)throw Error(name);}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{out.innerHTML='<li>Running…</li>';let p;try{
 await db.clearLibrary();await db.writePlaylists([]);const imported=[];
 for(const ext of ['mp3','mp4']){const blob=await (await fetch(`./fixtures/Test.${ext}`)).blob();const file=new File([blob],`Test.${ext}`,{type:ext==='mp3'?'audio/mpeg':'audio/mp4'});const track=await inspectFile(file);check(`${ext.toUpperCase()} duration and title metadata`,track.duration>13&&track.title===`Pocket test ${ext.toUpperCase()}`);await db.addTrack(track,file);imported.push(track);}
 let invalid=false;try{await inspectFile(new File(['invalid audio data!!!!!'],'Invalid.mp3'));}catch{invalid=true;}check('Invalid audio rejected',invalid);
 await db.writePlaylists([{id:'test-playlist',name:'Test mix',trackIds:imported.map(t=>t.id)}]);check('Playlist persists with ordered track references',(await db.readPlaylists())[0].trackIds[1]===imported[1].id);
 check('IndexedDB saves both tracks',(await db.listTracks()).length===2);check('Media blob survives separate read',(await db.getMedia(imported[0].id)).size>0);
 let renamed={...imported[0],title:'Renamed test'};await db.updateTrack(renamed);check('Rename persists',(await db.listTracks()).some(t=>t.title==='Renamed test'));
 const errors=[];p=new Player({},x=>errors.push(x));await p.setLibrary(await db.listTracks());await p.start(imported[0].id,imported.map(t=>t.id));await pause(500);check('MP3 starts native playback',!p.audio.paused&&p.audio.currentTime>0);
 p.seek(4);check('Seeking changes playback position',p.audio.currentTime>=3.9);p.audio.pause();await pause(80);check('Pause works',p.audio.paused);
 p.enqueue(imported[0].id);p.moveQueue(1,0);check('Queue supports reorder',p.state.queue[0]===imported[0].id);p.removeQueue(0);p.next();await pause(500);check('Next starts MP4 audio',p.state.current===imported[1].id&&!p.audio.paused);
 p.set('repeat','one');p.next(true);check('Repeat one keeps current track',p.state.current===imported[1].id);p.set('repeat','off');
 await p.enableEQ(true);p.preset('Bass Boost');check('EQ connects real filters and applies gains',p.filters.length===5&&p.filters[0].gain.value>=0&&p.context.state==='running');await pause(800);check('Bass filter reaches preset gain ('+p.filters[0].gain.value.toFixed(2)+' dB; context '+p.context.currentTime.toFixed(2)+'s)',p.filters[0].gain.value>5.5);await p.enableEQ(false);await pause(200);check('EQ off restores native playback',!p.context&&!p.audio.paused);
 p.seek(5);p.set('shuffle',true);p.set('repeat','all');p.audio.pause();p.persist();await pause(150);const saved=await db.readState();check('Position and modes persist',saved.position>=4.9&&saved.shuffle&&saved.repeat==='all');
 await db.deleteTracks([imported[0].id]);await p.setLibrary(await db.listTracks());check('Delete removes blob and metadata',!(await db.getMedia(imported[0].id))&&(await db.listTracks()).length===1);check('Deleted media pruned from playlists',(await db.readPlaylists())[0].trackIds.length===1);check('Deleted tracks pruned from queue',!p.state.queue.includes(imported[0].id));
 check('No player errors',errors.length===0);p.audio.pause();await db.clearLibrary();check('Clear library removes media',(await db.listTracks()).length===0&&!(await db.getMedia(imported[1].id)));document.querySelector('#run').textContent='All checks passed';
 }catch(e){p?.audio.pause();const li=document.createElement('li');li.className='fail';li.textContent='Stopped: '+e.message;out.append(li);}}
</script></html>
