<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101311" />
    <meta
      name="description"
      content="Your MP3s and MP4s, your little listening space. A private, local-first music player."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Pocket" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ccff7c'/%3E%3Cpath d='M22 17v30l25-15z' fill='%23101311'/%3E%3C/svg%3E"
    />
    <title>Pocket — Your local listening space</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <a class="brand" href="#library"
          ><span class="brand-mark">p</span> pocket<span class="brand-dot"
            >•</span
          ></a
        >
        <p class="eyebrow sidebar-label">YOUR SPACE</p>
        <nav id="desktop-nav"></nav>
        <div class="sidebar-bottom">
          <span class="privacy-icon">↳</span
          ><strong>Just you and your music.</strong>
          <p>Your files stay on this device.<br />No accounts. No uploads.</p>
          <button class="text-button" data-action="install">
            Install Pocket ↗
          </button>
        </div>
      </aside>
      <main id="main" tabindex="-1"></main>
      <div id="mini"></div>
      <nav id="mobile-nav" aria-label="Main navigation"></nav>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog"></dialog>
    <input
      type="file"
      id="file-input"
      accept=".mp3,.mp4,audio/mpeg,video/mp4,audio/mp4"
      multiple
      hidden
    />
    <div id="drop-overlay" hidden>
      Drop your MP3s and MP4s here<span>They’ll stay on this device.</span>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
